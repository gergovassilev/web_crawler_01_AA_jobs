<script>


// Unsichere Benutzereingaben
const userInputName = "Max Mustermann & Co.";
const userInputPayload = "<script>alert('xss')<\/script>";

// Parameter-Objekt erstellen
const params = new URLSearchParams();
params.append('name', userInputName);
params.append('payload', userInputPayload);

// Die fertige, sicher kodierte Query-String generieren
const queryString = params.toString(); 
// Ergebnis: name=Max+Mustermann+%26+Co.&payload=%3Cscript%3Ealert%28%27xss%27%29%3C%2Fscript%3E

// AJAX-Anfrage senden (Beispiel mit fetch)
fetch(`003_add_entries_2_db.php?${queryString}`)
  .then(response => response.json())
  .then(data => console.log(data));




</script>
